# Integracion continua: en cada push y pull request contra main, GitHub ejecuta
# el lint (ruff) y los tests (pytest). Los tests no necesitan el dataset ni GPU.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          # PyTorch de CPU: la CI no tiene GPU y la rueda es mucho mas ligera
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
